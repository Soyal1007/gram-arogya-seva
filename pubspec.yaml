name: gram_aarogya_seva
description: "Gram Aarogya Seva — Rural Healthcare Appointment System | UBA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (only services actively used)
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.7
  firebase_auth: ^5.5.4
  cloud_functions: ^5.3.4

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Data Layer
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & UX
  easy_localization: ^3.0.7+1
  table_calendar: ^3.2.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.0
  crypto: ^3.0.6
  connectivity_plus: ^6.1.2
  firebase_messaging: ^15.2.10
  firebase_crashlytics: ^4.3.10
  firebase_app_check: ^0.3.2+10
  firebase_remote_config: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  fake_cloud_firestore: ^3.1.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/icons/
    - assets/images/
